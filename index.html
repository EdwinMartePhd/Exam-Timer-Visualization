<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COP2271 Exam Timer</title>
<style>
  /* ---------- MATLAB-inspired palette (default plot color order + desktop chrome) ---------- */
  :root{
    --bg:#F3F4F6; --panel:#FFFFFF; --chrome:#E6ECF1; --border:#C9D1D9;
    --text:#1F2A36; --muted:#5B6773; --accent:#0076A8;
    --p1:#0072BD;   /* MATLAB blue   */
    --p2:#7E2F8E;   /* MATLAB purple */
    --ok:#77AC30;   /* MATLAB green  */
    --warn:#D95319; /* MATLAB orange */
    --crit:#A2142F; /* MATLAB dark red */
  }
  [data-theme="dark"]{
    --bg:#16191D; --panel:#1F2328; --chrome:#262B31; --border:#363D45;
    --text:#E8EDF2; --muted:#98A4B0; --accent:#4DBEEE;
    --p1:#4DA3E0; --p2:#B486C9; --ok:#8FC84A; --warn:#F08A3C; --crit:#E2566E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
       font-variant-numeric:tabular-nums}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem;
           background:var(--chrome);border-bottom:3px solid var(--accent)}
  .toolbar .brand{font-weight:700;letter-spacing:.02em}
  .toolbar .brand small{font-weight:400;color:var(--muted);margin-left:.5rem}
  .toolbar .spacer{flex:1}
  button,select,input{font:inherit;color:inherit}
  .btn{background:var(--panel);border:1px solid var(--border);border-radius:4px;
       padding:.4rem .8rem;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .kbd{font-size:.75rem;color:var(--muted)}

  /* ---------- setup ---------- */
  #setup{max-width:760px;margin:2rem auto;padding:0 1rem}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:1.5rem}
  .card h2{margin:0 0 1rem;font-size:1.25rem;color:var(--accent)}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.25rem}
  .form .full{grid-column:1/-1}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.3rem;color:var(--muted)}
  input,select{width:100%;padding:.5rem .6rem;border:1px solid var(--border);border-radius:4px;background:var(--bg)}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .row{display:flex;gap:.5rem}
  .row input{flex:1}
  .preview{margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1rem}
  .preview table{width:100%;border-collapse:collapse;font-size:.95rem}
  .preview td,.preview th{padding:.35rem .5rem;text-align:left;border-bottom:1px solid var(--border)}
  .preview th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase}
  .swatch{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.4rem;vertical-align:middle}
  .err{color:var(--crit);font-weight:600;min-height:1.2em;margin-top:.75rem}
  .actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}

  /* ---------- run view ---------- */
  #run{padding:1.25rem 2rem;max-width:1600px;margin:0 auto}
  .headline{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:1rem}
  .headline h1{margin:0;font-size:clamp(1.5rem,3vw,2.6rem)}
  .headline .date{color:var(--muted);font-size:clamp(1rem,1.6vw,1.4rem)}
  .grid{display:grid;grid-template-columns:2.2fr 1fr;gap:1.25rem}
  .main{background:var(--panel);border:1px solid var(--border);border-left:10px solid var(--p1);
        border-radius:6px;padding:1.25rem 1.75rem;display:flex;flex-direction:column;justify-content:center}
  .phase{font-size:clamp(1rem,2vw,1.6rem);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--p1)}
  .big{font-size:clamp(5rem,15vw,13rem);font-weight:300;line-height:1;margin:.4rem 0;color:var(--text)}
  .sub{font-size:clamp(1rem,2vw,1.6rem);color:var(--muted)}
  .main.warn .big{color:var(--warn)}
  .main.crit .big{color:var(--crit)}
  .main.done{border-left-color:var(--crit)}
  .main.done .phase{color:var(--crit)}
  .notice{margin-top:1rem;padding:.6rem .9rem;border-radius:4px;font-weight:600;
          font-size:clamp(1rem,1.8vw,1.4rem);background:color-mix(in srgb,var(--warn) 14%,transparent);
          border:1px solid var(--warn);color:var(--text)}
  .side{display:flex;flex-direction:column;gap:1rem}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:.9rem 1.1rem}
  .stat span{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .stat b{display:block;font-size:clamp(1.6rem,3.2vw,2.8rem);font-weight:500;margin-top:.2rem}

  .timeline{margin-top:1.5rem}
  .tl{position:relative;display:flex;height:34px;border-radius:4px;overflow:visible;gap:3px}
  .seg{position:relative;height:100%;border-radius:4px;overflow:hidden;
       background:color-mix(in srgb,var(--c) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
  .seg .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c)}
  .seg .lbl{position:absolute;inset:0;display:flex;align-items:center;padding-left:.6rem;
            font-weight:600;font-size:.9rem;color:var(--text);mix-blend-mode:normal}
  .seg.s1{--c:var(--p1)} .seg.s2{--c:var(--p2)}
  .marker{position:absolute;top:-7px;bottom:-7px;width:3px;background:var(--text);border-radius:2px;transform:translateX(-1px)}
  .ticks{position:relative;height:1.6rem;margin-top:.35rem;color:var(--muted);font-size:.95rem}
  .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .ticks span:first-child{transform:none}
  .ticks span:last-child{transform:translateX(-100%)}

  table.sched{width:100%;border-collapse:collapse;margin-top:1rem;background:var(--panel);
              border:1px solid var(--border);border-radius:6px;overflow:hidden;font-size:clamp(.95rem,1.4vw,1.2rem)}
  .sched th,.sched td{padding:.55rem .9rem;text-align:left;border-bottom:1px solid var(--border)}
  .sched th{background:var(--chrome);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .sched tr.now td{font-weight:700}
  .pill{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.8em;font-weight:600;border:1px solid var(--border);color:var(--muted)}
  .pill.now{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.done{color:var(--ok);border-color:var(--ok)}

  /* ---------- access codes ---------- */
  .section-title{grid-column:1/-1;margin:.5rem 0 0;padding-top:1rem;border-top:1px solid var(--border);
                 font-size:1rem;color:var(--accent)}
  .codes{display:flex;gap:1.25rem;margin-top:1.25rem}
  .code{flex:1;background:var(--panel);border:1px solid var(--border);border-top:6px solid var(--c);
        border-radius:6px;padding:.9rem 1.25rem}
  .code span{display:block;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .code b{display:block;font-family:Consolas,"Courier New",monospace;font-weight:700;
          font-size:clamp(2rem,4.5vw,4rem);letter-spacing:.06em;color:var(--c);word-break:break-all;margin:.15rem 0}
  .code small{color:var(--muted);font-size:.9rem}
  .code.c1{--c:var(--p1)} .code.c2{--c:var(--p2)}

  [hidden]{display:none!important}
  @media (max-width:900px){ .grid{grid-template-columns:1fr} .form{grid-template-columns:1fr} }
  /* Hide the toolbar in fullscreen for a clean projector view (S still opens setup) */
  :fullscreen .toolbar{display:none}
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand">Exam Timer <small id="tbTitle">COP2271</small></div>
  <div class="spacer"></div>
  <span class="kbd">F = fullscreen · S = setup</span>
  <select id="theme" class="btn" style="width:auto" title="Theme">
    <option value="light">Light</option>
    <option value="dark">Dark (projector)</option>
  </select>
  <button class="btn" id="btnSetup">Setup</button>
  <button class="btn" id="btnFull">Fullscreen</button>
</header>

<!-- ======================= SETUP ======================= -->
<section id="setup">
  <div class="card">
    <h2>Exam configuration</h2>
    <div class="form">
      <div class="full">
        <label for="fTitle">Exam title</label>
        <input id="fTitle" type="text">
      </div>
      <div>
        <label for="fDate">Exam date</label>
        <input id="fDate" type="date">
      </div>
      <div>
        <label for="fStart">Start time</label>
        <div class="row">
          <input id="fStart" type="time">
          <button class="btn" id="btnNow" type="button" title="Use the current time">Now</button>
        </div>
      </div>
      <div>
        <label for="fTotal">Total exam length (min)</label>
        <input id="fTotal" type="number" min="1" step="1">
      </div>
      <div>
        <label for="fP1">Part 1 length (min)</label>
        <input id="fP1" type="number" min="1" step="1">
      </div>
      <div>
        <label for="fP1Name">Part 1 name</label>
        <input id="fP1Name" type="text">
      </div>
      <div>
        <label for="fP2Name">Part 2 name</label>
        <input id="fP2Name" type="text">
      </div>
      <div>
        <label for="fWarn">Orange warning at (min left in part)</label>
        <input id="fWarn" type="number" min="0" step="1">
      </div>
      <div>
        <label for="fCrit">Red warning at (min left in part)</label>
        <input id="fCrit" type="number" min="0" step="1">
      </div>

      <h3 class="section-title">Access codes (passwords)</h3>
      <div>
        <label for="fPw1">Part 1 password</label>
        <div class="row">
          <input id="fPw1" type="password" autocomplete="off" placeholder="leave blank to not show">
          <button class="btn pwToggle" type="button" data-for="fPw1">Show</button>
        </div>
      </div>
      <div>
        <label for="fPw2">Part 2 password</label>
        <div class="row">
          <input id="fPw2" type="password" autocomplete="off" placeholder="leave blank to not show">
          <button class="btn pwToggle" type="button" data-for="fPw2">Show</button>
        </div>
      </div>
      <div>
        <label for="fPw1Before">Show Part 1 password (min before exam start)</label>
        <input id="fPw1Before" type="number" min="0" step="1">
      </div>
      <div>
        <label for="fPw1Hide">Hide Part 1 password (min after Part 1 ends)</label>
        <input id="fPw1Hide" type="number" min="0" step="1">
      </div>
      <div>
        <label for="fPw2After">Show Part 2 password (min after exam start)</label>
        <input id="fPw2After" type="number" min="0" step="1">
      </div>
    </div>

    <div class="preview">
      <table>
        <thead><tr><th>Section</th><th>Length</th><th>Starts</th><th>Ends</th></tr></thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>

    <div class="err" id="err"></div>
    <div class="actions">
      <button class="btn" id="btnDefaults" type="button">Reset to defaults</button>
      <button class="btn primary" id="btnStart" type="button">Show timer</button>
    </div>
  </div>
</section>

<!-- ======================= RUN ======================= -->
<main id="run" hidden>
  <div class="headline">
    <h1 id="rTitle"></h1>
    <div class="date" id="rDate"></div>
  </div>

  <div class="grid">
    <section class="main" id="mainCard">
      <div class="phase" id="phase"></div>
      <div class="big" id="big">--:--</div>
      <div class="sub" id="sub"></div>
      <div class="notice" id="notice" hidden></div>
    </section>
    <aside class="side">
      <div class="stat"><span>Current time</span><b id="now">--</b></div>
      <div class="stat"><span>Total exam time left</span><b id="totalLeft">--</b></div>
      <div class="stat"><span>Elapsed</span><b id="elapsed">--</b></div>
    </aside>
  </div>

  <div class="timeline">
    <div class="tl" id="tl">
      <div class="seg s1" id="seg1"><div class="fill"></div><div class="lbl" id="seg1lbl"></div></div>
      <div class="seg s2" id="seg2"><div class="fill"></div><div class="lbl" id="seg2lbl"></div></div>
      <div class="marker" id="marker"></div>
    </div>
    <div class="ticks">
      <span id="tkStart" style="left:0"></span>
      <span id="tkMid"></span>
      <span id="tkEnd" style="left:100%"></span>
    </div>
  </div>

  <table class="sched">
    <thead><tr><th>Section</th><th>Length</th><th>Starts</th><th>Ends</th><th>Status</th></tr></thead>
    <tbody id="schedBody"></tbody>
  </table>

  <div class="codes" id="codes" hidden>
    <div class="code c1" id="code1" hidden><span id="code1lbl"></span><b id="code1val"></b><small id="code1note"></small></div>
    <div class="code c2" id="code2" hidden><span id="code2lbl"></span><b id="code2val"></b><small id="code2note"></small></div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORE = "cop2271-exam-timer";

  // ---------- defaults (edit these to change the prefilled values) ----------
  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const DEFAULTS = {
    title: "COP2271 – Exam 2",
    date: today(),
    start: "20:20",
    total: 110,
    p1: 45,
    p1Name: "Part 1",
    p2Name: "Part 2",
    warn: 10,
    crit: 5,
    pw1: "",
    pw2: "",
    pw1Before: 2,   // Part 1 code appears 2 min before the start
    pw2After: 12,   // Part 2 code appears 12 min into Part 1
    pw1Hide: 10,    // Part 1 code disappears 10 min after Part 1 ends
    theme: "light"
  };

  let cfg = load();
  let timer = null, wakeLock = null;

  function load(){
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e) {}
    const c = { ...DEFAULTS, ...saved };
    if (!saved.date || saved.date < today()) c.date = today();   // never reopen on a past date
    return c;
  }
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch(e) {} }

  // ---------- formatting ----------
  const pad = n => String(n).padStart(2,"0");
  function dur(ms, round = Math.ceil){
    let s = Math.max(0, round(ms/1000));
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }
  const clock  = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const clockS = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"});

  // ---------- schedule ----------
  function schedule(c){
    const start = new Date(`${c.date}T${c.start}`);
    const p1End = new Date(start.getTime() + c.p1*60000);
    const end   = new Date(start.getTime() + c.total*60000);
    return { start, p1End, end, p2: c.total - c.p1 };
  }
  function validate(c){
    if (!c.title.trim()) return "Enter an exam title.";
    if (!c.date || !c.start) return "Enter a date and start time.";
    if (!(c.total > 0)) return "Total length must be greater than 0.";
    if (!(c.p1 > 0) || c.p1 >= c.total) return "Part 1 must be shorter than the total exam length.";
    if (c.crit > c.warn) return "The red warning should be at or below the orange warning.";
    if ([c.pw1Before, c.pw2After, c.pw1Hide].some(v => !(v >= 0))) return "Password timing values must be 0 or more.";
    return "";
  }

  // ---------- setup form ----------
  const fields = { title:"fTitle", date:"fDate", start:"fStart", total:"fTotal", p1:"fP1",
                   p1Name:"fP1Name", p2Name:"fP2Name", warn:"fWarn", crit:"fCrit",
                   pw1:"fPw1", pw2:"fPw2", pw1Before:"fPw1Before", pw2After:"fPw2After", pw1Hide:"fPw1Hide" };
  const numeric = new Set(["total","p1","warn","crit","pw1Before","pw2After","pw1Hide"]);

  // When each access code is on screen (ms timestamps)
  function codeWindows(c, s){
    const m = 60000;
    return {
      show1: s.start.getTime() - c.pw1Before*m,
      hide1: s.p1End.getTime() + c.pw1Hide*m,
      show2: s.start.getTime() + c.pw2After*m,
      hide2: s.end.getTime()                     // Part 2 code stays until the exam ends
    };
  }
  document.querySelectorAll(".pwToggle").forEach(b => b.onclick = () => {
    const inp = $(b.dataset.for), hidden = inp.type === "password";
    inp.type = hidden ? "text" : "password"; b.textContent = hidden ? "Hide" : "Show";
  });

  function fillForm(){ for (const k in fields) $(fields[k]).value = cfg[k]; $("theme").value = cfg.theme; updatePreview(); }
  function readForm(){
    const c = { ...cfg };
    for (const k in fields){ const v = $(fields[k]).value; c[k] = numeric.has(k) ? Number(v) : v; }
    return c;
  }
  function updatePreview(){
    const c = readForm(), msg = validate(c);
    $("err").textContent = msg;
    if (msg){ $("previewBody").innerHTML = ""; return; }
    const s = schedule(c);
    $("previewBody").innerHTML = `
      <tr><td><span class="swatch" style="background:var(--p1)"></span>${esc(c.p1Name)}</td><td>${c.p1} min</td><td>${clock(s.start)}</td><td>${clock(s.p1End)}</td></tr>
      <tr><td><span class="swatch" style="background:var(--p2)"></span>${esc(c.p2Name)}</td><td>${s.p2} min</td><td>${clock(s.p1End)}</td><td>${clock(s.end)}</td></tr>
      <tr><td><b>Total</b></td><td><b>${c.total} min</b></td><td>${clock(s.start)}</td><td>${clock(s.end)}</td></tr>`;
    const w = codeWindows(c, s), T = ms => clock(new Date(ms));
    const pwRow = (name, pw, a, b) => `<tr><td>🔑 ${esc(name)} password</td><td>${pw ? "set" : "<i>not set</i>"}</td><td>shown ${T(a)}</td><td>hidden ${T(b)}</td></tr>`;
    $("previewBody").innerHTML += pwRow(c.p1Name, c.pw1, w.show1, w.hide1) + pwRow(c.p2Name, c.pw2, w.show2, w.hide2);
  }
  const esc = t => String(t).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

  Object.values(fields).forEach(id => $(id).addEventListener("input", updatePreview));
  $("btnNow").onclick = () => {
    const d = new Date();
    $("fDate").value = today();
    $("fStart").value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    updatePreview();
  };
  $("btnDefaults").onclick = () => { cfg = { ...DEFAULTS, date: today() }; fillForm(); };
  $("btnStart").onclick = () => {
    const c = readForm(), msg = validate(c);
    if (msg){ $("err").textContent = msg; return; }
    cfg = c; save(); showRun();
  };

  // ---------- views ----------
  function showSetup(){
    clearInterval(timer); timer = null;
    $("run").hidden = true; $("setup").hidden = false; fillForm();
  }
  function showRun(){
    $("setup").hidden = true; $("run").hidden = false;
    $("rTitle").textContent = cfg.title;
    $("tbTitle").textContent = cfg.title;
    document.title = cfg.title + " · Timer";
    $("rDate").textContent = new Date(`${cfg.date}T12:00`).toLocaleDateString([], {weekday:"long", month:"long", day:"numeric", year:"numeric"});
    const s = schedule(cfg);
    $("seg1").style.flex = `${cfg.p1} 1 0`;
    $("seg2").style.flex = `${s.p2} 1 0`;
    $("seg1lbl").textContent = `${cfg.p1Name} · ${cfg.p1} min`;
    $("seg2lbl").textContent = `${cfg.p2Name} · ${s.p2} min`;
    $("tkStart").textContent = clock(s.start);
    $("tkMid").textContent = clock(s.p1End);
    $("tkMid").style.left = (cfg.p1/cfg.total*100) + "%";
    $("tkEnd").textContent = clock(s.end);
    requestWakeLock();
    tick(); clearInterval(timer); timer = setInterval(tick, 250);
  }

  // ---------- main loop (always computed from the wall clock, so it never drifts) ----------
  function tick(){
    const now = new Date(), s = schedule(cfg), t = now.getTime();
    const card = $("mainCard");
    let phase, big, sub, color, left = null, notice = "", current = 0;

    if (t < s.start){
      phase = "Exam has not started"; color = "var(--muted)";
      big = dur(s.start - t); sub = `until the exam starts at ${clock(s.start)}`;
    } else if (t < s.p1End){
      current = 1; left = s.p1End - t; color = "var(--p1)";
      phase = `${cfg.p1Name} in progress`; big = dur(left);
      sub = `left in ${cfg.p1Name} · ends at ${clock(s.p1End)}`;
    } else if (t < s.end){
      current = 2; left = s.end - t; color = "var(--p2)";
      phase = `${cfg.p2Name} in progress`; big = dur(left);
      sub = `left in ${cfg.p2Name} · exam ends at ${clock(s.end)}`;
      if (t - s.p1End < 3*60000) notice = `${cfg.p1Name} time is over. Submit ${cfg.p1Name} and begin ${cfg.p2Name}.`;
    } else {
      current = 3; phase = "Exam over"; big = "00:00";
      sub = `ended at ${clock(s.end)}`; notice = "Time is up. Please stop working and submit now.";
    }

    $("phase").textContent = phase;
    $("phase").style.color = current === 3 ? "" : color;
    card.style.borderLeftColor = current === 3 ? "" : color;
    $("big").textContent = big;
    $("sub").textContent = sub;
    $("notice").hidden = !notice; $("notice").textContent = notice;

    card.classList.toggle("done", current === 3);
    card.classList.toggle("crit", left !== null && left <= cfg.crit*60000);
    card.classList.toggle("warn", left !== null && left <= cfg.warn*60000 && left > cfg.crit*60000);

    $("now").textContent = clockS(now);
    $("totalLeft").textContent = t < s.start ? `${cfg.total} min` : dur(s.end - t);
    $("elapsed").textContent = t < s.start ? "0:00" : dur(Math.min(t, s.end.getTime()) - s.start, Math.floor);

    // progress bar
    const frac = (a,b) => Math.min(1, Math.max(0, (t - a)/(b - a)));
    $("seg1").querySelector(".fill").style.width = frac(s.start, s.p1End)*100 + "%";
    $("seg2").querySelector(".fill").style.width = frac(s.p1End, s.end)*100 + "%";
    $("marker").style.left = frac(s.start, s.end)*100 + "%";
    const done1 = frac(s.start, s.p1End) > .5, done2 = frac(s.p1End, s.end) > .5;
    $("seg1lbl").style.color = done1 ? "#fff" : ""; $("seg2lbl").style.color = done2 ? "#fff" : "";

    // schedule table
    const status = n => current > n ? '<span class="pill done">Done</span>'
                      : current === n ? '<span class="pill now">In progress</span>'
                      : '<span class="pill">Upcoming</span>';
    $("schedBody").innerHTML = `
      <tr class="${current===1?'now':''}"><td><span class="swatch" style="background:var(--p1)"></span>${esc(cfg.p1Name)}</td><td>${cfg.p1} min</td><td>${clock(s.start)}</td><td>${clock(s.p1End)}</td><td>${status(1)}</td></tr>
      <tr class="${current===2?'now':''}"><td><span class="swatch" style="background:var(--p2)"></span>${esc(cfg.p2Name)}</td><td>${s.p2} min</td><td>${clock(s.p1End)}</td><td>${clock(s.end)}</td><td>${status(2)}</td></tr>`;

    // access codes at the bottom
    const w = codeWindows(cfg, s);
    const on1 = !!cfg.pw1 && t >= w.show1 && t < w.hide1;
    const on2 = !!cfg.pw2 && t >= w.show2 && t < w.hide2;
    $("code1").hidden = !on1; $("code2").hidden = !on2; $("codes").hidden = !(on1 || on2);
    if (on1){
      $("code1lbl").textContent = `${cfg.p1Name} access code`;
      $("code1val").textContent = cfg.pw1;
      $("code1note").textContent = `removed at ${clock(new Date(w.hide1))}`;
    }
    if (on2){
      $("code2lbl").textContent = `${cfg.p2Name} access code`;
      $("code2val").textContent = cfg.pw2;
      $("code2note").textContent = t < s.p1End ? `use after you finish ${cfg.p1Name}` : `shown until ${clock(s.end)}`;
    }
  }

  // ---------- extras ----------
  async function requestWakeLock(){           // keeps the projector laptop from sleeping
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch(e) {}
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !$("run").hidden) requestWakeLock();
  });
  function toggleFull(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.();
  }
  function applyTheme(){ document.documentElement.dataset.theme = cfg.theme; }

  $("btnFull").onclick = toggleFull;
  $("btnSetup").onclick = () => $("setup").hidden ? showSetup() : (validate(cfg) ? null : showRun());
  $("theme").onchange = e => { cfg.theme = e.target.value; applyTheme(); save(); };
  document.addEventListener("keydown", e => {
    if (e.target.matches("input,select")) return;
    if (e.key === "f" || e.key === "F") toggleFull();
    if (e.key === "s" || e.key === "S") $("btnSetup").click();
  });

  applyTheme(); fillForm();
})();
</script>
</body>
</html>
